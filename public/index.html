<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-DO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>

    <script>
        async function addTodo() {
            axios.post('http://localhost:3000/addTodo', {

            })
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="signup-container" style="display: none;">
        <h2>Sign Up</h2>
        <input type="text" id="signup-username" placeholder="username" required>
        <input type="password" id="signup-password" placeholder="password" required>
        <button onclick="signup()">Signup</button>
        <button onclick="moveToSignIn()">Already have an account? Signin</button>
    </div>
    <div id="signin-container" style="display: block;">
        <h2>Sign In</h2>
        <input type="text" id="signin-username" placeholder="username" required>
        <input type="password" id="signin-password" placeholder="password" required>
        <button onclick="signin()">Signin</button>
        <button onclick="moveToSignUp()">Don't have an account? Signup</button>
    </div>
    <div id="todo-container" style="display: none;">
        <div>
            <h1>To-Do List</h1>
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="todos-input-container">
            <input type="text" id="input" placeholder="Add a new task">
            <button onclick="addTodo()">Add Todo</button>
        </div>

        <div id="todos-list"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
